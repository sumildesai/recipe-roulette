name: Build and deploy Recipe Roulette

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1,5"
  workflow_dispatch:
    inputs:
      refresh_catalog:
        description: Regenerate the catalog from YouTube and static recipe metadata before deploying
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore last generated catalog
        id: catalog-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            public/recipes.json
            .catalog-cache/meal-type-ai.json
          key: recipes-catalog-v1-${{ github.run_id }}
          restore-keys: recipes-catalog-v1-
      - name: Refresh catalog from official channels and metadata sources
        if: github.event_name == 'push' || github.event_name == 'schedule' || inputs.refresh_catalog
        run: npm run catalog:generate
        env:
          CATALOG_OUTPUT_PATH: public/recipes.json
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          MEAL_CLASSIFIER_REQUIRED: "true"
      - name: Verify refreshed catalog
        if: github.event_name == 'push' || github.event_name == 'schedule' || inputs.refresh_catalog
        run: |
          node -e "
            const catalog = require('./public/recipes.json');
            if (catalog.source !== 'generated') throw new Error('Catalog was not refreshed from generated sources');
            if (catalog.recipes.length <= 5) throw new Error('Refreshed catalog unexpectedly contains five or fewer recipes');
            console.log('Verified refreshed catalog with ' + catalog.recipes.length + ' recipes.');
          "
      - name: Save generated catalog for later deployments
        if: github.event_name == 'push' || github.event_name == 'schedule' || inputs.refresh_catalog
        uses: actions/cache/save@v4
        with:
          path: |
            public/recipes.json
            .catalog-cache/meal-type-ai.json
          key: recipes-catalog-v1-${{ github.run_id }}
      - name: Report catalog in use
        if: github.event_name != 'push' && github.event_name != 'schedule' && !inputs.refresh_catalog
        env:
          RESTORED_KEY: ${{ steps.catalog-cache.outputs.cache-matched-key }}
        run: |
          node -e "
            const catalog = require('./public/recipes.json');
            const restored = Boolean(process.env.RESTORED_KEY);
            console.log(restored
              ? 'Reusing the last generated catalog with ' + catalog.recipes.length + ' recipes.'
              : 'No generated catalog cached yet; deploying the checked-in seed catalog with ' + catalog.recipes.length + ' recipes.');
          "
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - name: Build static site
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
