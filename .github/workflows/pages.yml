name: Build and deploy Recipe Roulette

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh catalog from official channels
        run: npm run catalog:generate
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: Verify refreshed catalog
        run: |
          node -e "
            const catalog = require('./public/recipes.json');
            if (catalog.source !== 'youtube') throw new Error('Catalog was not refreshed from YouTube');
            if (catalog.recipes.length <= 5) throw new Error('Refreshed catalog unexpectedly contains five or fewer recipes');
            console.log('Verified refreshed catalog with ' + catalog.recipes.length + ' recipes.');
          "
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - name: Build static site
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
